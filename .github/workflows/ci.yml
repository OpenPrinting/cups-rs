name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always


jobs:
  # Check formatting
  fmt:
    name: Format
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check


  # Build and test across architectures and CUPS releases.
  #
  # Matrix: 4 architectures x 3 CUPS releases = 12 combinations.
  #   architectures: amd64, arm64 (native runners); armhf, riscv64 (QEMU)
  #   CUPS releases: 2.4.x (distro libcups2-dev), 2.5.x (OpenPrinting/cups
  #                  master), 3.x (OpenPrinting/libcups master)
  #
  # All the per-combination work lives in ci/ci-setup.sh, so the legs differ
  # only in which CUPS is provided and whether they run under emulation.
  #
  build:
    name: Build & Test (${{ matrix.arch }}, ${{ matrix.cups }})
    runs-on: ${{ matrix.runs-on }}
    # The source-* legs build CUPS from OpenPrinting @master, an unpinned
    # moving target: a transient breakage there (e.g. libcups master failing
    # its own `make install`) reddens the leg through no fault of cups-rs.
    # Keep the distro system-2x leg required (blocking), but let the
    # source-@master legs report without blocking. ci-setup.sh annotates each
    # failure as UPSTREAM-DEP-FAILED vs CUPS-RS-FAILED so a real regression on
    # these legs is still visible even while non-blocking.
    continue-on-error: ${{ matrix.cups != 'system-2x' }}
    # Building CUPS from source under QEMU is slow; allow plenty.
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, armhf, riscv64]
        cups: [system-2x, source-2.5.x, source-3.x]
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
            use-qemu: false
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            use-qemu: false
          - arch: armhf
            runs-on: ubuntu-24.04
            use-qemu: true
            qemu-arch: armv7
          - arch: riscv64
            runs-on: ubuntu-24.04
            use-qemu: true
            qemu-arch: riscv64

    steps:
      - uses: actions/checkout@v4

      # ==========================================
      # NATIVE EXECUTION (amd64 and arm64)
      # ==========================================
      - name: Set up Rust
        if: matrix.use-qemu == false
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test (Native)
        if: matrix.use-qemu == false
        run: |
          set -ex
          sh ci/ci-setup.sh deps
          sh ci/ci-setup.sh cups "${{ matrix.cups }}"
          sh ci/ci-setup.sh build-test "${{ matrix.cups }}"

      # ==========================================
      # EMULATED EXECUTION (armhf and riscv64)
      # ==========================================
      - name: Build & Test (Emulated)
        if: matrix.use-qemu == true
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.qemu-arch }}
          distro: ubuntu24.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update --fix-missing -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y tzdata ca-certificates git curl build-essential
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            set -ex
            . "$HOME/.cargo/env"
            sh ci/ci-setup.sh deps
            sh ci/ci-setup.sh cups "${{ matrix.cups }}"
            sh ci/ci-setup.sh build-test "${{ matrix.cups }}"
